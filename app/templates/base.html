<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OrderDesk{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="desk-bar">
    <span class="brand" data-testid="brand">OrderDesk</span>
    {% if user %}
    <nav>
      <a href="/orders/new" data-testid="nav-new-order">New order</a>
      <a href="/orders" data-testid="nav-blotter">Blotter</a>
    </nav>
    <div class="who">
      <span data-testid="current-user">{{ user.username }}</span>
      <span class="role" data-testid="current-role">{{ user.role }}</span>
      <form method="post" action="/logout"><button class="link" data-testid="logout">Log out</button></form>
    </div>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
